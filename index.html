<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>E-Commerce Templates</title>

        <!-- Fonts -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

        <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

        <!-- Material Symbols -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" />

        <style>
            :root {
                --primary: #f44234;
                --primary-container: #ffe3df;
                --bg: #f6f7fb;
                --surface: #ffffff;
                --text: #1c1b1f;
                --text-secondary: #5f5f68;
                --outline: #d8d8e0;
                --shadow: 0 2px 6px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.06);
                --radius: 30px;
            }
            body.dark {
                --bg: #111318;
                --surface: #1b1d23;
                --text: #f2f2f3;
                --text-secondary: #b7b8be;
                --outline: #31343d;
                --primary-container: #3f1b17;
                --shadow: 0 2px 6px rgba(0, 0, 0, 0.35), 0 10px 30px rgba(0, 0, 0, 0.35);
            }
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                font-family: "Roboto", sans-serif;
                background: var(--bg);
                color: var(--text);
                transition: 0.25s ease;
                min-height: 100vh;
            }
            .topbar {
                position: sticky;
                top: 0;
                z-index: 100;
                backdrop-filter: blur(18px);
                background: color-mix(in srgb, var(--bg) 82%, transparent);
                border-bottom: 1px solid var(--outline);
            }
            .topbar-inner {
                max-width: 1500px;
                margin: auto;
                padding: 18px 22px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 18px;
            }
            .brand {
                display: flex;
                align-items: center;
                gap: 14px;
            }
            .brand-icon {
                width: 58px;
                height: 58px;
                border-radius: 22px;
                background: var(--primary-container);
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--primary);
                box-shadow: var(--shadow);
            }
            .brand-icon span {
                font-size: 30px;
            }
            .brand h1 {
                font-size: 1.45rem;
                font-weight: 700;
                line-height: 1.2;
            }
            .brand p {
                color: var(--text-secondary);
                margin-top: 4px;
                font-size: 0.95rem;
            }
            .toolbar {
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .icon-btn {
                width: 52px;
                height: 52px;
                border: none;
                cursor: pointer;
                border-radius: 18px;
                background: var(--surface);
                color: var(--text);
                display: flex;
                align-items: center;
                justify-content: center;
                box-shadow: var(--shadow);
                transition: 0.22s ease;
            }
            .icon-btn:hover {
                transform: translateY(-2px);
            }
            .repo-btn {
                text-decoration: none;
                background: var(--primary);
                color: #fff;
                padding: 14px 22px;
                border-radius: 999px;
                display: flex;
                align-items: center;
                gap: 10px;
                font-weight: 500;
                box-shadow: var(--shadow);
                transition: 0.22s ease;
            }
            .repo-btn:hover {
                transform: translateY(-2px);
            }
            .container {
                max-width: 1500px;
                margin: auto;
                padding: 34px 22px 70px;
            }
            .hero {
                margin-bottom: 28px;
                background: var(--surface);
                border: 1px solid var(--outline);
                border-radius: 40px;
                padding: 34px;
                box-shadow: var(--shadow);
                position: relative;
                overflow: hidden;
            }
            .hero::before {
                content: "";
                position: absolute;
                top: -120px;
                right: -120px;
                width: 260px;
                height: 260px;
                border-radius: 50%;
                background: radial-gradient( circle, rgba(244, 66, 52, 0.18), transparent 70%
                );
            }
            .hero h2 {
                font-size: 2.3rem;
                margin-bottom: 14px;
            }
            .hero p {
                max-width: 850px;
                color: var(--text-secondary);
                line-height: 1.8;
                font-size: 1rem;
            }
            .grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
                gap: 24px;
            }
            .card {
                background: var(--surface);
                border: 1px solid var(--outline);
                border-radius: 32px;
                padding: 24px;
                transition: 0.28s ease;
                box-shadow: var(--shadow);
                display: flex;
                flex-direction: column;
                position: relative;
                overflow: hidden;
            }
            .card::before {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient( circle at top right,  rgba(244, 66, 52, 0.12), transparent 45% );
                pointer-events: none;
            }
            .card:hover {
                transform: translateY(-6px);
            }
            .card-top {
                display: flex;
                align-items: baseline;
                justify-content: flex-start;
                margin-bottom: 20px;
                gap: 20px;
            }
            .template-icon {
                width: 60px;
                height: 60px;
                border-radius: 20px;
                background: var(--primary-container);
                color: var(--primary);
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .template-icon span {
                font-size: 30px;
            }
            .template-name {
                font-size: 2rem;
                font-weight: 700;
                margin-bottom: 14px;
            }
            .actions {
                display: flex;
                gap: 12px;
                margin-top: auto;
            }
            .btn {
                flex: 1;
                text-decoration: none;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 8px;
                padding: 14px;
                border-radius: 18px;
                font-weight: 500;
                transition: 0.22s ease;
            }
            .btn-primary {
                background: var(--primary);
                color: white;
            }
            .btn-primary:hover {
                transform: translateY(-2px);
            }
            .btn-outline {
                border: 1px solid var(--outline);
                color: var(--text);
                background: transparent;
            }
            .btn-outline:hover {
                background: rgba(244, 66, 52, 0.08);
                border-color: var(--primary);
            }
            footer {
                padding: 20px 20px 60px;
                text-align: center;
                color: var(--text-secondary);
                font-size: 0.94rem;
            }
            @media (max-width: 720px) {
                .topbar-inner {
                    flex-direction: column;
                    align-items: flex-start;
                }
                .toolbar {
                    width: 100%;
                }
                .repo-btn {
                    flex: 1;
                    justify-content: center;
                }
                .hero h2 {
                    font-size: 1.7rem;
                }
                .hero {
                    padding: 24px;
                }
            }
        </style>
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-inner">
                <div class="brand">
                    <div class="brand-icon">
                        <span class="material-symbols-rounded"> storefront </span>
                    </div>
                    <div>
                        <h1>E-Com</h1>
                        <p>Modern E-commerce Website Projects That You Want To See.</p>
                    </div>
                </div>
                <div class="toolbar">
                    <button class="icon-btn" id="themeToggle">
                        <span class="material-symbols-rounded" id="themeIcon"> dark_mode </span>
                    </button>
                    <a class="repo-btn" href="https://github.com/MainRoute-Core/e-com" target="_blank">
                      <span class="material-symbols-rounded"> code </span> Repository
                    </a>
                </div>
            </div>
        </header>
        <main class="container">
            <section class="hero">
                <h2>E-Commerce Website Templates</h2>
                <p> 
                    Explore a curated collection of modern, responsive and elegant e-commerce website projects with free downloading on desktop.
                </p>
            </section>
            <section class="grid" id="templatesGrid"></section>
        </main>
        <footer> &copy; 2025-<span id="year">2026</span> • MainRoute-Core</footer>
        <script>
            const previewBase = "https://mainroute-core.github.io/e-com";
            const repoBase = "https://github.com/MainRoute-Core/e-com/tree/main";
            const downloadApi = "https://GitFolderDownloader.github.io/api/?url=";
            const templates = [ 
                "Amado", "Aranoz", "Ashion", "Bookly", 
                "BookSaw", "Caraft", "ColoShop",
                "CozaStore", "Cycle", "Eflyer", "Eiser",
                "Eshopper", "Essence", "Famms", "FoodMart",
                "FootWear", "FreshShop", "Fruitables", "Fruitkha",
                "Furni", "Hexashop", "Kaira", "Karma", "Majestic",
                "MaleFashion", "Mellow","MiniShop", "MiniStore",
                "Ogani", "Organic", "PillowMart", "Productly",
                "ShionHouse", "ShopMax", "Shoppers", "Stylish", 
                "ThePlaza", "Tropiko", "Vegefoods", "Violet",
                "Waggy", "Watch", "Winkel", "Wish"
                ];
            const grid = document.getElementById("templatesGrid");
            const body = document.body;
            const toggle = document.getElementById("themeToggle");
            const icon = document.getElementById("themeIcon");
            const isDesktop = !/Android|iPhone|iPad|iPod|Opera Mini|IEMobile|WPDesktop/i.test( navigator.userAgent );
            
            templates.forEach(name => {
                const previewUrl = `${previewBase}/${name}/`;
                const repoUrl = `${repoBase}/${name}`;
                const downloadUrl = `${downloadApi}${encodeURIComponent(repoUrl)}&st=0&mx=10&name=${name}`;
                const card = document.createElement("div");
                card.className = "card";
                card.innerHTML = `
                <div class="card-top"> 
                    <div class="template-icon">
                        <span class="material-symbols-rounded"> shopping_bag </span>
                    </div>
                    <div class="template-name"> ${name} </div>
                </div>
                <div class="actions">
                    <a class="btn btn-primary" href="${previewUrl}" target="_blank">
                        <span class="material-symbols-rounded">preview</span> 
                        Preview 
                    </a> 
                    ${ isDesktop ? `<a class="btn btn-outline" href="${downloadUrl}" target="_blank">
                        <span class="material-symbols-rounded">download </span>
                        Download
                    </a>
                    `: "" }
                </div>
                `;
                grid.appendChild(card);
            });
            const savedTheme = localStorage.getItem("theme");
            if (savedTheme) {
                body.classList.toggle("dark", savedTheme === "dark");
            } else {
                const prefersDark = window.matchMedia(
                  "(prefers-color-scheme: dark)" ).matches;
                  body.classList.toggle("dark", prefersDark);
            }
            updateThemeIcon();
            toggle.onclick = () => {
                body.classList.toggle("dark");
                localStorage.setItem( "theme", body.classList.contains("dark") ? "dark" : "light" );
                updateThemeIcon();
            };
            window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
                    if (localStorage.getItem("theme")) return;
                    body.classList.toggle("dark", e.matches);
                    updateThemeIcon();
                });
            function updateThemeIcon() {
                icon.textContent = body.classList.contains("dark")
                    ? "light_mode"
                    : "dark_mode";
            }
            function searchTemplates(value) {
                const cards = document.querySelectorAll(".card");
                cards.forEach(card => {
                    const text = card.innerText.toLowerCase();
                    card.style.display = text.includes(value.toLowerCase()) ? "flex" : "none"; });
            }
        </script>
        <script>
          document.getElementById('year').textContent = new Date().getDateFullYear();
        </script>
    </body>
</html>
